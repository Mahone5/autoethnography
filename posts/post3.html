          <h2>The Moose</h2>
          <h3>
            <div class="quote">
              <i
                >"Many other things did he as well. If every one of them were
                written down, I suppose that even the whole world would not have
                room for the books that would be written."</i
              >
              <div class="attribution">--John, New Testament</div>
            </div>
          </h3>

            <p>
              Moose is one the MPs guarding the XYZ compound. Really, he is the
              leader of the whole company, though just a low-ranking enlisted
              man. The captain, the theoretical leader, would be laughed out of
              the Boy Scouts. He wore paratrooper pants and carried a swagger

              hearing what my psychiatrist at the Substitute for Living would
              have to say about him.
            </p>

            <p>
              Shortly before Nam, Moose was the 191 pound high-school state
              wrestling champion of Oregon. He also rode rodeo. After the war,
              he organized Namstock, where quite a few guys from our unit
              gathered for the Christmas holidays, because none of us fit into
              society after returning home. Thai sticks were in plentious
              supply, as we had mailed home a ton of it by using official U.S.
              Government top secret envelopes. We all attended the VVAW (Vietnam
              Veterans Against the War) rally downtown and threw our medals in
              the fire. As we said our good-byes, Moose says to me, "I'll see
              you in Bangkok." I had no plans to visit there, but I did like
              those Thai sticks quite a bit.
            </p>
            <p>
              We were stationed with the Thai soldiers. Besides Americans, there
              were Thai, Canadian, Australian, and South Korean soldiers in Nam.
              Lung Choop (Uncle Choop) was Moose's counterpart in the Thai
              group. The Thai's would come over in planes just loaded with
              duffle bags filled with Thai sticks. Moose would buy a duffle bag
              for us for $90. Whenever a new duffle bag came in we would clean
              the weed off the sticks and repackage some for personal use, the
              rest for the official U.S. Government envelopes, which didn't
