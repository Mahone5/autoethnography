            <p>
              Our school prepares us well for nuclear attack. A nuke could drop

            <p>
              They teach us the three R's. After school, we play baseball,
              football, get into fights, and on the way home stop by Aunt
              Ethyl's, who gives us liberal portions of candy. I never forget
              the sound of her doorbell. I hear the same chime in Japan, and at
              New Mexico State University. Then back home for dinner, and likely
              to chapel.
            </p>

            <p>
              We go to chapel a lot, more than any of my school friends. Our
              chapel has deep, important, and dogmatic theological beliefs held
              by almost no one else in the world. We distinguish ourselves by
              calling our meeting place a chapel, definitely not a church. Our
              path is straight and narrow. Almost all people outside our little
              flock are bound for eternal damnation, where there is weeping,
              wailing and gnashing of teeth, forever and ever. Never ending
